name: Maid AI Windows Package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build Forge Bridge
        working-directory: maid-ai-bridge
        shell: pwsh
        run: .\gradlew.bat build --no-daemon

      - name: Set up Node 24.14.1
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'

      - name: Set up pnpm 11.19.0
        uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
          run_install: false

      - name: Build and test DeepSeek Harness integration
        shell: pwsh
        run: |
          pnpm --dir dsh-integration install --frozen-lockfile
          python tools/package_windows.py --check-dsh-lock --require-installed
          pnpm --dir dsh-integration run build
          pnpm --dir dsh-integration test

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            agent-core/pyproject.toml
            control-center/pyproject.toml
            rnd-runner/pyproject.toml

      - name: Install Python projects and packaging tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e 'agent-core[dev]' -e 'control-center[test,package]' -e 'rnd-runner[test]'

      - name: Build Windows package
        run: python tools/package_windows.py

      - name: Packaged EXE self-test
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\dist\MaidAI\Maid AI Control.exe" -ArgumentList "--self-test" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Packaged EXE self-test failed with exit code $($process.ExitCode)"
          }

      - name: Resolve the single production Bridge JAR
        id: bridge
        shell: pwsh
        run: |
          $jars = @(Get-ChildItem 'maid-ai-bridge/build/libs/MaidAI-Bridge-*.jar' -File | Where-Object { $_.Name -notmatch '-(sources|javadoc)\.jar$' })
          if ($jars.Count -ne 1) {
            throw "Expected exactly one production Bridge JAR, found $($jars.Count)"
          }
          "path=$($jars[0].FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Final Windows release acceptance
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: agent-core/src;control-center/src;rnd-runner/src
        run: >-
          python tools/final_acceptance.py
          --release-check
          --bridge-jar "${{ steps.bridge.outputs.path }}"
          --windows-package dist/MaidAI

      - name: Upload Windows release ZIP and validation
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MaidAI-Windows-0.3.0-Release
          compression-level: 0
          if-no-files-found: error
          path: |
            dist/MaidAI-Windows-0.3.0.zip
            validation/*

      - name: Upload failed Windows validation
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MaidAI-Windows-0.3.0-Failed-Validation
          if-no-files-found: warn
          path: validation/*
