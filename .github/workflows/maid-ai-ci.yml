name: Maid AI Linux Source CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build Forge Bridge
        working-directory: maid-ai-bridge
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            agent-core/pyproject.toml
            control-center/pyproject.toml
            rnd-runner/pyproject.toml

      - name: Install Linux Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install Python projects
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e 'agent-core[dev]' -e 'control-center[test]' -e 'rnd-runner[test]'

      - name: Set up Node 24.14.1
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'

      - name: Set up pnpm 11.19.0
        uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
          run_install: false

      - name: Build and test DeepSeek Harness integration
        run: |
          pnpm --dir dsh-integration install --frozen-lockfile
          python tools/package_windows.py --check-dsh-lock --require-installed
          pnpm --dir dsh-integration run build
          pnpm --dir dsh-integration test

      - name: Run Python and offscreen UI tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: agent-core/src:control-center/src:rnd-runner/src
        shell: bash
        run: |
          mkdir -p validation
          set +e
          python -m pytest -q agent-core/tests control-center/tests rnd-runner/tests --junitxml=validation/pytest-linux.xml 2>&1 | tee validation/pytest-linux.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Resolve the single production Bridge JAR
        id: bridge
        shell: bash
        run: |
          mapfile -t jars < <(find maid-ai-bridge/build/libs -maxdepth 1 -type f -name 'MaidAI-Bridge-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | sort)
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected exactly one production Bridge JAR, found ${#jars[@]}" >&2
            exit 1
          fi
          echo "path=${jars[0]}" >> "$GITHUB_OUTPUT"

      - name: Final source acceptance
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: agent-core/src:control-center/src:rnd-runner/src
        run: >-
          python tools/final_acceptance.py
          --source-check
          --bridge-jar "${{ steps.bridge.outputs.path }}"
          --skip-tests

      - name: Upload Linux validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MaidAI-Linux-Validation
          if-no-files-found: warn
          path: |
            maid-ai-bridge/build/libs/MaidAI-Bridge-*.jar
            validation/*
