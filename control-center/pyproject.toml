[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "maid-ai-control-center"
version = "0.3.0"
description = "Maid AI Windows control center"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pydantic>=2.8,<3",
  "keyring>=25,<27",
  "PySide6>=6.7,<7",
  "websockets>=14,<17",
]

[project.optional-dependencies]
package = ["pyinstaller>=6.10,<7"]
test = ["pytest>=8,<10"]

[project.scripts]
maid-ai-control = "maid_ai_control.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/maid_ai_control"]
