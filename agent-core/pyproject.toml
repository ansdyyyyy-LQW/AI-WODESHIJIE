[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "maid-ai-agent-core"
version = "0.3.0"
description = "Production autonomous Agent Core for a real Touhou Little Maid EntityMaid"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "websockets>=13,<17",
  "httpx>=0.27,<1",
  "keyring>=25,<27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
maid-agent = "maid_agent.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/maid_agent"]

[tool.hatch.build.targets.wheel.force-include]
"src/maid_agent/prompts/runtime_system.md" = "maid_agent/prompts/runtime_system.md"
"src/maid_agent/prompts/rnd_system.md" = "maid_agent/prompts/rnd_system.md"
