plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

group = mod_group_id
version = mod_version
base { archivesName = 'MaidAI-Bridge' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            mods { maid_ai_bridge { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("maven.modrinth:touhou-little-maid:1.5.3-forge+mc1.20.1")
}

tasks.named('processResources', ProcessResources).configure {
    var props = [minecraft_version:minecraft_version, forge_version:forge_version, mod_id:mod_id, mod_name:mod_name, mod_version:mod_version]
    inputs.properties props
    filesMatching(['META-INF/mods.toml','pack.mcmeta']) { expand props }
}

tasks.named('jar', Jar).configure {
    manifest { attributes(['Specification-Title':mod_name,'Specification-Version':mod_version,'Implementation-Title':project.name,'Implementation-Version':archiveVersion]) }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

tasks.register('testHandUseOutcome', JavaExec) {
    dependsOn testClasses
    classpath = files(sourceSets.test.output, sourceSets.main.output)
    mainClass = 'com.maidaibridge.action.impl.HandUseOutcomeTest'
}

tasks.named('check').configure { dependsOn 'testHandUseOutcome' }
